# ==============================================================================
# SupportFlow AI — Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/supportflow.conf
# Symlink to: /etc/nginx/sites-enabled/supportflow.conf
# ==============================================================================

# Rate limiting zone for public edge protection (burst allowed, keyed by IP)
limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=30r/s;

# Upstream Backend API
upstream backend_api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend SPA
upstream frontend_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Redirect all traffic to HTTPS + ACME challenge path
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name supportflow.example.com;

    # Let's Encrypt ACME challenge location for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — TLS Termination, Security Headers & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supportflow.example.com;

    # TLS Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/supportflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supportflow.example.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Standard Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request Body Size Limitation (aligned with application limit 10MB)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/supportflow_access.log;
    error_log /var/log/nginx/supportflow_error.log warn;

    # Edge rate limiting
    limit_req zone=edge_limit burst=50 nodelay;

    # --------------------------------------------------------------------------
    # API Endpoints (FastAPI Backend)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts aligned with long-running LLM and RAG graph steps
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffer sizing for structured JSON responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA (React + Vite static bundle via Nginx)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }
}
