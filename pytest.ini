[pytest]
# SupportFlow AI — Pytest Configuration
# Phase 15: Automated Test Hardening

asyncio_mode = auto

testpaths =
    tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers used across the test suite
markers =
    asyncio: mark test as async (auto-used via asyncio_mode=auto)
    unit: pure unit tests — no database, no HTTP, no external services
    integration: integration tests — database I/O, ORM, migration state
    api: HTTP API contract tests — exercises ASGI app via AsyncClient
    eval: AI evaluation benchmarks — RAG metrics, retrieval quality, faithfulness
    security: security and penetration test assertions (IDOR, RBAC, JWT fuzzing)
    slow: tests that take >2s (can be deselected with -m "not slow")

# Minimum verbosity for CI readability
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider

# Logging during test runs
log_cli = false
log_level = WARNING
