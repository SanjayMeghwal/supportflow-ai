services:
  db:
    image: pgvector/pgvector:pg16
    container_name: supportflow-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-supportflow_db}
    volumes:
      - supportflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supportflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - supportflow-network

  redis:
    image: redis:7-alpine
    container_name: supportflow-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - supportflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - supportflow-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supportflow-prod-backend
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-SupportFlow AI}
      - APP_ENV=production
      - DEBUG=False
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      - POSTGRES_DB=${POSTGRES_DB:-supportflow_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supportflow_db}
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-True}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a secure 32+ char key in production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://localhost}
      - ENABLE_SECURITY_HEADERS=True
      - HSTS_ENABLED=${HSTS_ENABLED:-False}
      - ENABLE_DOCS=${ENABLE_DOCS:-False}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-100}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10}
      - RATE_LIMIT_AI=${RATE_LIMIT_AI:-20}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-10}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.75}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - supportflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: supportflow-prod-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - supportflow-network

volumes:
  supportflow_pgdata:
    name: supportflow_prod_pgdata
  supportflow_redisdata:
    name: supportflow_prod_redisdata

networks:
  supportflow-network:
    name: supportflow-prod-network
    driver: bridge
